[project]
name = "coda"
version = "0.17.7"
description = "Cosmos Observability and Diagnostic Agent — customer-facing Cosmos DB diagnostics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.25.3",
    "azure-core>=1.41.0",
    "azure-monitor-query>=1.4,<2.0",
    "azure-mgmt-cosmosdb>=9.9.0",
    "azure-mgmt-monitor>=6.0,<7.0",
    "azure-mgmt-subscription>=3.1",
    "packaging>=26.2",
    "fastapi>=0.116",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.35",
]

[project.scripts]
coda = "coda_core.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp>=1.28.1,<2.0",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "httpx>=0.28",
]

