[tool.uv]
required-version = "==0.12.3"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["public: offline public packaging and boundary tests"]
